name: Build Office NRO

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libraries
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm switch-sdl2 switch-sdl2_ttf switch-freetype switch-harfbuzz switch-bzip2 switch-libpng switch-zlib

      - name: Build
        run: make

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: Office
          path: Office.nro
